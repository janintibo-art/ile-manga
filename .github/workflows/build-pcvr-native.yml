name: Build Windows EXE VR et PC

on:
  push:
    branches: [main]
    paths:
      - "pcvr/**"
      - "www/assets/**"
      - ".github/workflows/build-pcvr-native.yml"
  workflow_dispatch:

jobs:
  windows-vr-et-pc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 110
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Godot 4.7.2 et templates Windows
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Preparer les vrais modeles et textures
        run: python3 pcvr/stage_assets.py

      - name: Importer scene GLB et ressources Godot
        run: godot --headless --editor --path pcvr --import

      - name: Verifier systeme de sauvegarde et interface
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          a = Path('pcvr/scripts/main.gd').read_text()
          b = Path('pcvr/scripts/menu_v8.gd').read_text()
          c = Path('pcvr/scripts/save_manager.gd').read_text()
          assert 'func _create_game_menu_v8() -> void:' in a
          assert 'func _start_save_slot(' in a
          assert 'SLOT_COUNT: int = 6' in c
          assert 'autosave.json' in c
          assert 'right_hand.get_float("trigger")' in b
          assert 'application/icon="res://assets/ui/ile_manga_icon.ico"' in Path('pcvr/export_presets.cfg').read_text()
          print('Menu, six sauvegardes, autosave et icone : fichiers OK')
          PYTEST

      - name: Controler la physique V11
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          s = Path('pcvr/scripts/main.gd').read_text()
          for name in ('CharacterBody3D.new()', 'move_and_slide()', 'create_trimesh_shape()', 'CapsuleShape3D.new()', '_sync_physics_after_load_v11()'):
              assert name in s, f'Physique manquante: {name}'
          assert s.count('func _physics_process(delta: float) -> void:') == 1
          print('Contrôles statiques physique OK')
          PYTEST

      - name: Controle GDScript (VR)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path pcvr --quit-after 5 2>&1 | tee /tmp/ile_manga_v21_vr.log
          if grep -E 'SCRIPT ERROR|Parse Error|Cannot load source code' /tmp/ile_manga_v21_vr.log; then exit 1; fi

      - name: Verifier l'inversion du joystick et la separation PC
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import configparser
          code = Path('pcvr/scripts/main.gd').read_text()
          assert '(right * stick.x + forward * stick.y)' in code
          assert 'func _create_ground_details() -> void:' in code
          assert 'Viewport.MSAA_4X' in code and 'Viewport.MSAA_2X' in code
          assert 'env.ssao_enabled = true' in code
          assert 'func _create_village_details_v7() -> void:' in code
          assert 'Galets_plage_v6' in code and 'Lanterne_chaude_v6' in code
          assert 'if OS.has_feature("ile_manga_pc"):' in code
          cfg = configparser.ConfigParser(interpolation=None)
          cfg.read('pcvr/export_presets.cfg')
          assert cfg['preset.0']['name'] == '"Windows VR"'
          assert cfg['preset.1']['name'] == '"Windows PC"'
          assert cfg['preset.0']['custom_features'] == '"ile_manga_vr"'
          assert cfg['preset.1']['custom_features'] == '"ile_manga_pc"'
          assert 'openxr/enabled=true' in Path('pcvr/project.godot').read_text()
          print('Configurations PC et VR distinctes : OK')
          PYTEST

      - name: Exporter exe VR native OpenXR
        working-directory: pcvr
        run: |
          mkdir -p ../dist
          godot --headless --export-release "Windows VR" ../dist/Ile_Manga_VR_v21.exe

      - name: Tester la preparation PC (independante du numero de version)
        run: python3 -m py_compile pcvr/set_pc_export.py

      - name: Preparer le mode PC classique SANS OpenXR
        run: python3 pcvr/set_pc_export.py

      - name: Verifier que le mode PC n'active pas OpenXR
        run: |
          grep -q 'openxr/enabled=false' pcvr/project.godot
          godot --headless --editor --path pcvr --import

      - name: Controle GDScript (PC)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path pcvr --quit-after 5 2>&1 | tee /tmp/ile_manga_v21_pc.log
          if grep -E 'SCRIPT ERROR|Parse Error|Cannot load source code' /tmp/ile_manga_v21_pc.log; then exit 1; fi

      - name: Exporter exe PC normal (clavier / souris)
        working-directory: pcvr
        run: godot --headless --export-release "Windows PC" ../dist/Ile_Manga_PC_v21.exe

      - name: Verifier les shaders haute definition PC et VR
        run: |
          grep -q 'uniform bool extra_detail' pcvr/shaders/terrain.gdshader
          grep -q 'wave_strength' pcvr/shaders/water.gdshader
          grep -q 'Herbes_multimesh' pcvr/scripts/main.gd

      - name: Verifier exactement deux EXE Windows
        shell: bash
        run: |
          test -s dist/Ile_Manga_VR_v21.exe
          test -s dist/Ile_Manga_PC_v21.exe
          test "$(find dist -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          file dist/*.exe
          du -h dist/*.exe

      - name: Telechargement de la version VR Quest 3
        uses: actions/upload-artifact@v4
        with:
          name: Ile-Manga-VR-v21
          path: dist/Ile_Manga_VR_v21.exe
          if-no-files-found: error
          retention-days: 30

      - name: Telechargement de la version PC classique
        uses: actions/upload-artifact@v4
        with:
          name: Ile-Manga-PC-v21
          path: dist/Ile_Manga_PC_v21.exe
          if-no-files-found: error
          retention-days: 30
