name: Déployer sur GitHub Pages

# Publie le dossier www/ en site HTTPS (nécessaire pour la VR WebXR).
# Se lance à chaque push sur main, ou à la main depuis l'onglet Actions.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site (dossier www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
