name: Build PC VR Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "desktop/**"
      - ".github/workflows/build-pc-vr.yml"
  pull_request:
    paths:
      - "www/**"
      - "desktop/**"
      - ".github/workflows/build-pc-vr.yml"
  workflow_dispatch:

jobs:
  windows-pc-vr:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les outils Windows PC
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Assembler le jeu avec Babylon.js en local et verifier les modules
        working-directory: desktop
        run: npm run stage

      - name: Verifier la syntaxe des fichiers JavaScript
        shell: pwsh
        run: |
          Get-ChildItem pc-site/src -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
          node --check desktop/main.cjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --check desktop/panel.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compiler l'executable Windows x64 portable
        working-directory: desktop
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publier le EXE telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: ile-manga-pc-vr-windows-exe
          path: dist/pcvr/*.exe
          if-no-files-found: error
          retention-days: 30
